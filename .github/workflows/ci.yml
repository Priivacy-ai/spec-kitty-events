name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    # `--locked`, not `--frozen`: frozen silently installs a stale lock, while
    # locked fails when pyproject.toml and uv.lock disagree (issue #8).
    - name: Install dependencies (pinned by committed uv.lock)
      run: uv sync --locked --extra dev --extra conformance --python ${{ matrix.python-version }}

    - name: Run pytest with coverage
      run: |
        uv run --no-sync pytest --cov --cov-report=xml

    - name: Run mypy type checker
      run: |
        uv run --no-sync mypy src/spec_kitty_events --strict

    - name: Upload coverage to Codecov (optional)
      if: matrix.python-version == '3.10'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
